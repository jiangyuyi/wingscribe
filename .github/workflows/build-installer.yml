name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: cpu
          - mode: gpu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace "^v", ""
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Resolved version is empty"
          }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "mode=${{ matrix.mode }}" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version (${{ matrix.mode }} mode)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Python downloads
        uses: actions/cache@v4
        with:
          path: |
            installer/wheels-${{ matrix.mode }}
            installer/build-${{ matrix.mode }}/python-*.zip
          key: ${{ runner.os }}-${{ matrix.mode }}-python-${{ steps.get_version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.mode }}-python-

      - name: Download Inno Setup
        shell: pwsh
        run: |
          # Download Inno Setup 6
          $isUrl = "https://files.jrsoftware.org/is/6/isetup-6.4.1.exe"
          $isPath = "C:\innosetup.exe"
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            Write-Host "Downloading Inno Setup..."
            Invoke-WebRequest -Uri $isUrl -OutFile $isPath -UseBasicParsing
            Write-Host "Installing Inno Setup..."
            Start-Process $isPath -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=C:\InnoSetup" -Wait
            Remove-Item $isPath
          } else {
            Write-Host "Inno Setup already installed"
          }

      - name: Run build script
        shell: pwsh
        run: |
          Write-Host "Running build script for ${{ matrix.mode }} mode..."
          & .\installer\build.ps1 -Mode ${{ matrix.mode }} -Version "${{ steps.get_version.outputs.version }}"

      - name: Create UI assets (placeholder)
        shell: pwsh
        run: |
          # Create placeholder icons and images
          $assetsDir = "installer\assets"
          if (-not (Test-Path $assetsDir)) {
            New-Item -ItemType Directory -Path $assetsDir -Force | Out-Null
          }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          $version = "${{ steps.get_version.outputs.version }}"
          $iss = ".\installer\installer.iss"
          if ("${{ matrix.mode }}" -eq "gpu") {
            $iss = ".\installer\installer-gpu.iss"
          }
          Write-Host "Building ${{ matrix.mode }} installer with $iss"
          & $iscc "/DAppVersion=$version" $iss

      - name: Get installer size
        shell: pwsh
        run: |
          $modeUpper = "${{ matrix.mode }}".ToUpper()
          $version = "${{ steps.get_version.outputs.version }}"
          $installer = Get-Item "installer/Output/WingScribe-Setup-$modeUpper-$version.exe"
          $sizeInMB = [math]::Round($installer.Length / 1MB, 2)
          Write-Host "Installer size: $sizeInMB MB"

      - name: Upload CPU installer artifact
        if: matrix.mode == 'cpu'
        uses: actions/upload-artifact@v4
        with:
          name: WingScribe-Installer-${{ steps.get_version.outputs.version }}-${{ matrix.mode }}
          path: installer/Output/WingScribe-Setup-CPU-${{ steps.get_version.outputs.version }}.exe
          retention-days: 30

      - name: Upload GPU installer artifact
        if: matrix.mode == 'gpu'
        uses: actions/upload-artifact@v4
        with:
          name: WingScribe-Installer-${{ steps.get_version.outputs.version }}-${{ matrix.mode }}
          path: installer/Output/WingScribe-Setup-GPU-${{ steps.get_version.outputs.version }}.exe
          retention-days: 30

  release:
    needs: build
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace "^v", ""
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Resolved version is empty"
          }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Creating release for version: $version"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        shell: pwsh
        run: |
          Get-ChildItem -Path artifacts -Recurse -Filter "*.exe" | ForEach-Object {
            Write-Host "Found: $($_.FullName)"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          files: |
            artifacts/**/WingScribe-Setup-CPU-${{ steps.get_version.outputs.version }}.exe
            artifacts/**/WingScribe-Setup-GPU-${{ steps.get_version.outputs.version }}.exe
          draft: false
          prerelease: false
          body: |
            ## WingScribe ${{ steps.get_version.outputs.version }}

            ### 下载安装包

            根据您的硬件选择对应的安装包：

            - **CPU 版本**: `WingScribe-Setup-CPU-${{ steps.get_version.outputs.version }}.exe`
              - 适用于没有 NVIDIA 显卡或不需要 GPU 加速的用户
              - 使用 CPU 进行 AI 推理，速度较慢但兼容性好

            - **GPU 版本**: `WingScribe-Setup-GPU-${{ steps.get_version.outputs.version }}.exe`
              - 需要 NVIDIA 显卡（支持 CUDA）
              - 使用 GPU 进行 AI 推理，速度更快

            ### 系统要求

            **通用要求：**
            - Windows 10 或更高版本
            - 至少 2GB 可用内存
            - 至少 2GB 硬盘空间（运行时需要更多空间存储照片和模型）

            **GPU 版本额外要求：**
            - NVIDIA 显卡（GTX 1060 或更高）
            - NVIDIA 驱动版本 >= 450.00

            ### 安装说明

            1. 双击安装包开始安装
            2. 按照配置向导设置照片目录和输出目录
            3. 安装完成后启动 Web 服务
            4. 在浏览器中访问 http://localhost:8000

            ### 首次使用

            首次运行时，AI 模型会自动下载（约 500MB），请耐心等待。

            ### 更新说明

            此版本包含以下改进：
            - 完整的 Windows 安装包（CPU/GPU 双版本）
            - 图形化配置向导
            - CPU 和 GPU 模式支持
            - 一键启动 Web 服务
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "## Build Summary" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- **Version**: ${{ steps.get_version.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- **CPU Installer**: artifacts/**/WingScribe-Setup-CPU-${{ steps.get_version.outputs.version }}.exe" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- **GPU Installer**: artifacts/**/WingScribe-Setup-GPU-${{ steps.get_version.outputs.version }}.exe" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- **Status**: ${{ job.status }}" >> $env:GITHUB_STEP_SUMMARY
