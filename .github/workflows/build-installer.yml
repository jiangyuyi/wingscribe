name: Verify WingScribe 3.0.1 downloads
on:
  workflow_dispatch:
    inputs:
      source:
        description: Downloads to verify
        required: true
        type: choice
        options: [release]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: jiangyuyi/wingscribe
      CANDIDATE: 83151bb74fe6fa6a7fb88df26fd2b68d17e9be3a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 83151bb74fe6fa6a7fb88df26fd2b68d17e9be3a
          persist-credentials: false
      - name: Download published assets
        if: inputs.source == 'release'
        shell: bash
        run: |
          test "$(gh api repos/$REPO/commits/v3.0.1 --jq .sha)" = "$CANDIDATE"
          gh release view v3.0.1 --repo "$REPO" --json isDraft,isPrerelease | jq -e '(.isDraft or .isPrerelease)|not'
          gh release download v3.0.1 --repo "$REPO" -D verify/release
      - name: Check every file against its manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess,sys,os
          root=Path('verify'); checked=set(); summary=[]
          for mode in ('cpu','gpu'):
              name=f'WingScribe-Setup-{mode.upper()}-3.0.1'; manifest,=root.rglob(name+'.sha256.json')
              data=json.loads(manifest.read_text()); assert (data['mode'],data['version'])==(mode,'3.0.1')
              subprocess.run([sys.executable,'scripts/installer_artifacts.py','--verify',str(manifest)],check=True)
              checked.add(manifest); files=data['files']; assert mode!='cpu' or len(files)==1
              for f in files:
                  checked.add(manifest.parent/f['name']); summary.append(f"{f['name']}  {f['size']}  {f['sha256']}")
          assert checked=={p for p in root.rglob('*') if p.is_file()}
          print('\n'.join(summary));open(os.environ['GITHUB_STEP_SUMMARY'],'a').write('Verified bytes and SHA-256\n\n```\n'+'\n'.join(summary)+'\n```\n')
          PY
