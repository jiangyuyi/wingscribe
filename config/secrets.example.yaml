# WingScribe 密钥配置文件样例 (secrets.yaml)
# 请将此文件复制为 'secrets.yaml' 并填入您的 API 密钥。
# secrets.yaml 已被 .gitignore 忽略；本样例是公开文件，不要填入真实密钥。

# 旧式流水线识别客户端；仅在使用对应模式时填写匹配协议的服务地址。
# 云端线上验证未完成，local 模式无需填写这些项。
recognition:
  api:
    key: ""
    url: ""
  dongniao:
    key: ""
    url: ""

# 云端识别配置 (用于 cloud 模式)
cloud:
  # HuggingFace 云端识别
  huggingface:
    api_token: ""                 # HuggingFace API Token
    model_id: "imageomics/bioclip-2"  # 使用的模型

  # ModelScope 云端识别
  modelscope:
    api_token: ""                 # ModelScope API Token

  # 百度云鸟类识别
  baidu:
    api_key: ""                   # 百度 API Key
    secret_key: ""                # 百度 Secret Key

  # 阿里云鸟类识别
  aliyun:
    access_key_id: ""             # 阿里云 AccessKey ID
    access_key_secret: ""         # 阿里云 AccessKey Secret
