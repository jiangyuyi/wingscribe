# WingScribe 主配置文件样例 (settings.yaml)
# 请根据您的实际环境修改后保存为 settings.yaml

paths:
  # 照片源目录（必填，使用绝对路径）
  # 程序会从这些位置寻找新照片
  sources:
    - path: "D:/Photos/Birds/2026"  # 源照片目录（绝对路径）
      recursive: true                 # 是否递归扫描子目录
      enabled: true                  # 是否启用此源

  # 输出设置
  output:
    # 处理后的照片存放目录（必填，使用绝对路径）
    root_dir: "D:/Photos/Birds/Output"

    # 目录结构模板
    # 可选变量: {year}, {month}, {day}, {date}, {location}, {species_cn}, {species_sci}, {confidence}, {filename}, {source_structure}
    # {source_structure} 表示保留原始文件夹的层级
    structure_template: "{source_structure}/{filename}_{species_cn}_{confidence}"

    # 是否将元数据写回原始照片 (慎用！这会修改您的原始素材)
    write_back_to_source: false

  # 参考数据目录（相对于项目根目录）
  references_path: "data/references"

  # 数据库路径
  # - 不写此配置时，默认使用相对于运行目录的 "data/db/wingscribe.db"
  # - 支持绝对路径，如 "C:/Users/jiang/data/wingscribe.db"（推荐：放本地以提升性能）
  # - 支持相对路径，相对于项目根目录
  # db_path: "data/db/wingscribe.db"

  # IOC 鸟类分类数据 Excel 文件路径（相对于项目根目录）
  ioc_list_path: "data/references/Multiling IOC 15.1_d.xlsx"

  # 模型缓存目录（相对于项目根目录）
  # 存放下载的 YOLO、BioCLIP 等模型文件
  model_cache_dir: "data/models"

processing:
  # 硬件设备: cuda (NVIDIA 显卡), cpu, 或 auto (自动检测)
  device: "auto"

  # YOLO 检测模型 (用于找鸟)
  # 推荐: yolo26n.pt (精度最高、推理最快)
  # 可选: yolo11n.pt, yolov8n.pt
  yolo_model: "data/models/yolo26n.pt"

  # 检测置信度阈值 (0-1): 只有高于此值的鸟类目标才会被处理
  confidence_threshold: 0.5

  # 模糊检测阈值: 拉普拉斯方差法，低于此值会标记为模糊并跳过
  # 建议值: 40-100，值越高要求越清晰
  blur_threshold: 40.0

  # 质量处理模式:
  # legacy_reject 保持旧行为，按 blur_threshold 跳过模糊图
  # score_only 仅计算综合质量指标，不跳过图片；disabled 完全关闭质量计算
  quality_mode: "legacy_reject"

  # 裁切图尺寸: 建议保持 640
  target_size: 640

  # 裁切边距: 在鸟类方框周围预留的像素宽度
  crop_padding: 200

recognition:
  # 识别模式: local (本地 BioCLIP), api (HuggingFace API), dongniao (懂鸟 API)
  mode: "local"

  # 地域过滤: auto (根据文件夹名自动判断), china (仅限中国鸟种), null (全球)
  region_filter: "auto"

  # 保存备选物种的数量
  top_k: 5

  # 自动通过阈值: 如果首选识别结果高于此置信度，则不显示备选建议
  alternatives_threshold: 70

  # 标记为"不确定"的阈值: 低于此分数的识别结果会被标记
  low_confidence_threshold: 60

  # HuggingFace 镜像加速地址 (国内服务器使用)
  # 常用镜像: https://hf-mirror.com
  # 如果为空则不使用镜像 (需要能够正常访问 huggingface.co)
  hf_mirror: "https://hf-mirror.com"

  # 本地模型配置
  local:
    # 选项: bioclip, bioclip-2 (推荐), bioclip-2.5-vith14 (实验，约 4GB 权重)
    model_type: "bioclip-2"
    batch_size: 512            # 文本编码批次大小 (通常不需要修改)
    inference_batch_size: 16   # 图片推理批次大小，显存不足(低于 8G)时请调小

web:
  # Web 服务器监听地址
  host: "0.0.0.0"

  # Web 服务器端口
  port: 8000

  # 日志级别: info (仅显示关键信息), debug (显示详细处理过程)
  # 推荐: 调试时用 debug，正常运行时用 info
  log_level: "info"
