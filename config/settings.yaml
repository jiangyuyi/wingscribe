paths:
  base_dir: Y:/
  references_path: data/references
  sources:
  - path: 1按年份/
    recursive: true
    enabled: true
  output:
    root_dir: ''
    structure_template: '{source_structure}/{filename}_{species_cn}_{confidence}'
    write_back_to_source: false
  ioc_list_path: data/references/Multiling IOC 15.1_d.xlsx
  model_cache_dir: data/models
  db_path: ''
processing:
  device: auto
  yolo_model: yolov26n.pt
  confidence_threshold: 0.5
  blur_threshold: 40.0
  target_size: 640
  crop_padding: 200
recognition:
  mode: local
  region_filter: auto
  top_k: 5
  alternatives_threshold: 70
  low_confidence_threshold: 60
  hf_mirror: https://hf-mirror.com
  local:
    model_type: bioclip-2
    batch_size: 512
    inference_batch_size: 16
web:
  host: 0.0.0.0
  port: 8000
  log_level: info
