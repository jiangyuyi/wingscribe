# FeatherTrace config
# Generated by deploy script

paths:
  # 相对路径的根目录（数据库中存储相对于此目录的路径）
  base_dir: "Y:/1按年份/2026"
  allowed_roots:
    - "Y:/1按年份/2026"
  references_path: "data/references"
  sources:
    - path: "."  # 相对于 base_dir
      recursive: true
      enabled: true
  output:
    root_dir: "clip"  # 相对于 base_dir
    structure_template: "{source_structure}/{filename}_{species_cn}_{confidence}"
    write_back_to_source: false
  db_path: "data/db/wingscribe.db"
  ioc_list_path: "data/references/Multiling IOC 15.1_d.xlsx"
  model_cache_dir: "data/models"
processing:
  device: "cuda"
  yolo_model: "yolo26n.pt"
  confidence_threshold: 0.5
  # 模糊检测阈值 (Laplacian方差法，分数范围0~∞，典型: <30模糊, 30-100一般, >100清晰, 鸟类照片通常200+)
  blur_threshold: 90
  target_size: 640
  crop_padding: 200
recognition:
  mode: "local"
  region_filter: "auto"
  top_k: 5
  alternatives_threshold: 70
  low_confidence_threshold: 60
  # HuggingFace 镜像配置（国内加速下载）
  # 可选值: "https://hf-mirror.com" (推荐), "https:// mirrors.huggingface.co"
  hf_mirror: "https://hf-mirror.com"
  local:
    model_type: "bioclip-2"
    batch_size: 512
    inference_batch_size: 16
web:
  host: "0.0.0.0"
  port: 8000
